<line x1="80" y1="595.75" x2="110" y2="595.75" stroke="#555555" stroke-width="2" marker-end="url(#a-end)"/>
<line x1="58" y1="184.75" x2="100" y2="184.75" stroke="#fff" stroke-width="7"/>
<line x1="58" y1="184.75" x2="100" y2="184.75" stroke="#c0392b" stroke-width="2"/>
<line x1="58" y1="358.75" x2="100" y2="358.75" stroke="#fff" stroke-width="7"/>
<line x1="58" y1="358.75" x2="100" y2="358.75" stroke="#c0392b" stroke-width="2"/>
<line x1="58" y1="495.75" x2="110" y2="495.75" stroke="#fff" stroke-width="7"/>
<line x1="58" y1="495.75" x2="110" y2="495.75" stroke="#c0392b" stroke-width="2" marker-end="url(#a-fail)"/>
<line x1="36" y1="234.75" x2="100" y2="234.75" stroke="#fff" stroke-width="7"/>
<line x1="36" y1="234.75" x2="100" y2="234.75" stroke="#1e8449" stroke-width="2"/>
<line x1="36" y1="408.75" x2="100" y2="408.75" stroke="#fff" stroke-width="7"/>
<line x1="36" y1="408.75" x2="100" y2="408.75" stroke="#1e8449" stroke-width="2"/>
<line x1="36" y1="545.75" x2="110" y2="545.75" stroke="#fff" stroke-width="7"/>
<line x1="36" y1="545.75" x2="110" y2="545.75" stroke="#1e8449" stroke-width="2" marker-end="url(#a-ok)"/>
<line x1="116" y1="636.0" x2="146" y2="636.0" stroke="#c0392b" stroke-width="2" marker-end="url(#a-fail)"/>
<text x="158" y="641.0" fill="#444">acabaram as tentativas → resultado 0</text>
<line x1="116" y1="661.0" x2="146" y2="661.0" stroke="#1e8449" stroke-width="2" marker-end="url(#a-ok)"/>
<text x="158" y="666.0" fill="#444">acertou → resultado 1</text>
<line x1="116" y1="686.0" x2="146" y2="686.0" stroke="#555555" stroke-width="2" marker-end="url(#a-end)"/>
<text x="158" y="691.0" fill="#444">fim do programa</text>
<text x="1106" y="691.0" text-anchor="end" fill="#999" font-size="12">gerado por tools/draw_program.py · destino do beq = PC + imm</text>
